[tool.pylint."MASTER"]
init-hook = 'import sys; sys.path.insert(0, "dhscanner.infra")'

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "fixme",
    "invalid-name",
    "import-error",
    "line-too-long",
    "duplicate-code",
    "missing-timeout",
    "ungrouped-imports",
    "wrong-import-order",
    "superfluous-parens",
    "missing-class-docstring",
    "missing-module-docstring",
    "missing-function-docstring"
]
ignore-paths = ["dhscanner\\.core", "dhscanner\\.packages"]

[tool.mypy]
exclude = "^dhscanner\\.(core|packages)/"
ignore_missing_imports = true
mypy_path = "dhscanner.infra"